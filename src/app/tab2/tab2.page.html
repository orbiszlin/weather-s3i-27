<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Weather
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  @let place = place$ | async;

  @if (place) {
    <ion-card>
      <ion-card-content class="ion-display-flex ion-justify-content-between">
        <div>
          <ion-card-title>{{ place.name }}</ion-card-title>
          <ion-card-subtitle>{{ place.main.temp }}</ion-card-subtitle>
          <p>{{ place.base }}</p>
        </div>
        <div>text B</div>
      </ion-card-content>
    </ion-card>
  }


</ion-content>
