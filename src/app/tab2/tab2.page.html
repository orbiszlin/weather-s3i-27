<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Weather
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  @for (place of places; track $index) {
    <ion-card>
      <ion-card-content class="ion-display-flex ion-justify-content-between">
        <div>
          <ion-card-title>{{ place.title }}</ion-card-title>
          <ion-card-subtitle>{{ place.temperature }} C</ion-card-subtitle>
          <p>{{ place.description }}</p>
        </div>
        <div>text B</div>
      </ion-card-content>
    </ion-card>
  }

</ion-content>
